
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sidebar Component</title>

  <link href="./src/output.css" rel="stylesheet">
</head>

<body class="bg-gray-50 min-h-screen">

  <!-- Navigation Toggle -->
  <div class="lg:hidden py-16 text-center">

    <button
      type="button"
      class="py-2 px-3 inline-flex justify-center items-center gap-x-2 text-start bg-secondary border border-secondary-line text-secondary-foreground text-sm font-medium rounded-lg shadow-2xs hover:bg-secondary-hover focus:outline-hidden focus:bg-secondary-focus"
      aria-haspopup="dialog"
      aria-expanded="false"
      aria-controls="hs-sidebar-content-push-to-mini-sidebar"
      aria-label="Toggle navigation"
      data-hs-overlay="#hs-sidebar-content-push-to-mini-sidebar">

      Open

    </button>

  </div>
  <!-- End Navigation Toggle -->


  <!-- Sidebar -->

  <div
    id="hs-sidebar-content-push-to-mini-sidebar"
    class="hs-overlay [--auto-close:lg] hs-overlay-minified:w-13 lg:block lg:translate-x-0 lg:inset-e-auto lg:bottom-0 w-64 hs-overlay-open:translate-x-0 -translate-x-full transition-all duration-300 transform h-full hidden overflow-x-hidden fixed top-0 inset-s-0 bottom-0 z-60 bg-sidebar border-e border-sidebar-line"
    role="dialog"
    tabindex="-1"
    aria-label="Sidebar">

    <div class="relative flex flex-col h-full max-h-full">


      <!-- Header -->

      <header class="py-4 px-2 flex justify-between items-center gap-x-2">

        <!-- Brand -->

        <a
          class="flex-none font-semibold text-xl text-layer-foreground focus:outline-hidden focus:opacity-80 hs-overlay-minified:hidden"
          href="#"
          aria-label="Brand">

          Brand

        </a>

        <!-- End Brand -->


        <!-- Mobile Close Button -->

        <div class="lg:hidden">

          <button
            type="button"
            class="flex justify-center items-center gap-x-3 size-6 bg-layer border border-layer-line text-sm text-muted-foreground-2 hover:bg-layer-hover rounded-full disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-layer-focus"
            data-hs-overlay="#hs-sidebar-content-push-to-mini-sidebar">

            <svg
              class="shrink-0 size-4"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">

              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>

            </svg>

            <span class="sr-only">
              Close
            </span>

          </button>

        </div>

        <!-- End Mobile Close Button -->


        <!-- Desktop Minify Button -->

        <div class="hidden lg:block">

          <button
            type="button"
            class="flex justify-center items-center flex-none gap-x-3 size-9 text-sm text-muted-foreground-2 hover:bg-muted-hover rounded-full disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-muted-focus"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="hs-sidebar-content-push-to-mini-sidebar"
            aria-label="Minify navigation"
            data-hs-overlay-minifier="#hs-sidebar-content-push-to-mini-sidebar">

            <!-- Minified Icon -->

            <svg
              class="hidden hs-overlay-minified:block shrink-0 size-4"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">

              <rect width="18" height="18" x="3" y="3" rx="2"></rect>
              <path d="M15 3v18"></path>
              <path d="m8 9 3 3-3 3"></path>

            </svg>

            <!-- Normal Icon -->

            <svg
              class="hs-overlay-minified:hidden shrink-0 size-4"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">

              <rect width="18" height="18" x="3" y="3" rx="2"></rect>
              <path d="M15 3v18"></path>
              <path d="m10 15-3-3 3-3"></path>

            </svg>

            <span class="sr-only">
              Navigation Toggle
            </span>

          </button>

        </div>

        <!-- End Desktop Minify Button -->

      </header>

      <!-- End Header -->


      <!-- Body -->

      <nav
        class="h-full overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-scrollbar-track [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb">

        <div class="pb-0 px-2 w-full flex flex-col flex-wrap">

          <ul class="space-y-1">


            <!-- Dashboard -->

            <li>

              <a
                class="min-h-[36px] flex items-center gap-x-3.5 py-2 px-2.5 bg-sidebar-nav-active text-sm text-sidebar-nav-foreground rounded-lg hover:bg-sidebar-nav-hover focus:outline-hidden focus:bg-sidebar-nav-focus"
                href="#">

                <svg
                  class="size-4"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round">

                  <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                  <polyline points="9 22 9 12 15 12 15 22"></polyline>

                </svg>

                <span class="hs-overlay-minified:hidden">
                  Dashboard
                </span>

              </a>

            </li>

            <!-- End Dashboard -->


            <!-- Calendar -->

            <li>

              <a
                class="min-h-[36px] w-full flex items-center gap-x-3.5 py-2 px-2.5 text-sm text-sidebar-nav-foreground rounded-lg hover:bg-sidebar-nav-hover focus:outline-hidden focus:bg-sidebar-nav-focus"
                href="#">

                <svg
                  class="size-4"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round">

                  <rect width="18" height="18" x="3" y="4" rx="2" ry="2"></rect>
                  <line x1="16" x2="16" y1="2" y2="6"></line>
                  <line x1="8" x2="8" y1="2" y2="6"></line>
                  <line x1="3" x2="21" y1="10" y2="10"></line>

                  <path d="M8 14h.01"></path>
                  <path d="M12 14h.01"></path>
                  <path d="M16 14h.01"></path>
                  <path d="M8 18h.01"></path>
                  <path d="M12 18h.01"></path>
                  <path d="M16 18h.01"></path>

                </svg>

                <span class="text-nowrap hs-overlay-minified:hidden">

                  Calendar

                  <span
                    class="ms-auto py-0.5 px-1.5 inline-flex items-center gap-x-1.5 text-xs bg-surface-1 text-surface-foreground rounded-full">

                    New

                  </span>

                </span>

              </a>

            </li>

            <!-- End Calendar -->


            <!-- Documentation -->

            <li>

              <a
                class="min-h-[36px] w-full flex items-center gap-x-3.5 py-2 px-2.5 text-sm text-sidebar-nav-foreground rounded-lg hover:bg-sidebar-nav-hover focus:outline-hidden focus:bg-sidebar-nav-focus"
                href="#">

                <svg
                  class="size-4"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round">

                  <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                  <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>

                </svg>

                <span class="hs-overlay-minified:hidden">
                  Documentation
                </span>

              </a>

            </li>

            <!-- End Documentation -->


          </ul>

        </div>

      </nav>

      <!-- End Body -->

    </div>

  </div>

  <!-- End Sidebar -->


  <!-- Preline JavaScript -->

  <script src="./node_modules/preline/dist/preline.js"></script>

  <script>

    window.addEventListener("load", () => {

      setTimeout(() => {

        if (window.HSStaticMethods) {
          window.HSStaticMethods.autoInit();
        }

      }, 100);

    });

  </script>

</body>

</html>
