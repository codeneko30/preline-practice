<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Bar Examples</title>
  <!-- Tailwind CSS Local Output -->
  <link href="./src/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

  <div class="max-w-xl w-full bg-white p-6 rounded-2xl border border-gray-200 shadow-sm space-y-4">
    
    <!-- 25% Progress -->
    <div class="flex w-full h-4 bg-gray-100 rounded-full overflow-hidden" role="progressbar" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
      <div class="flex flex-col justify-center rounded-full overflow-hidden bg-blue-600 text-xs text-white text-center whitespace-nowrap transition duration-500" style="width: 25%">25%</div>
    </div>

    <!-- 50% Progress -->
    <div class="flex w-full h-4 bg-gray-100 rounded-full overflow-hidden" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
      <div class="flex flex-col justify-center rounded-full overflow-hidden bg-blue-600 text-xs text-white text-center whitespace-nowrap transition duration-500" style="width: 50%">50%</div>
    </div>

    <!-- 75% Progress -->
    <div class="flex w-full h-4 bg-gray-100 rounded-full overflow-hidden" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
      <div class="flex flex-col justify-center rounded-full overflow-hidden bg-blue-600 text-xs text-white text-center whitespace-nowrap transition duration-500" style="width: 75%">75%</div>
    </div>

    <!-- 100% Progress -->
    <div class="flex w-full h-4 bg-gray-100 rounded-full overflow-hidden" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
      <div class="flex flex-col justify-center rounded-full overflow-hidden bg-blue-600 text-xs text-white text-center whitespace-nowrap transition duration-500" style="width: 100%">100%</div>
    </div>

  </div>

  <!-- Preline UI JavaScript -->
  <script src="./node_modules/preline/dist/preline.js"></script>
</body>
</html>
