
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preline UI Switch Practice</title>
  <!-- Tailwind Output CSS -->
  <link href="./src/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

  <!-- Switch / Toggle -->
  <label for="hs-basic-usage" class="relative inline-block w-11 h-6 cursor-pointer">
    <input type="checkbox" id="hs-basic-usage" class="peer sr-only">
    <span class="absolute inset-0 bg-gray-200 rounded-full transition-colors duration-200 ease-in-out peer-checked:bg-blue-600 peer-disabled:opacity-50 peer-disabled:pointer-events-none"></span>
    <span class="absolute top-1/2 start-0.5 -translate-y-1/2 size-5 bg-white rounded-full shadow-sm transition-transform duration-200 ease-in-out peer-checked:translate-x-full"></span>
  </label>
  <!-- End Switch -->

  <!-- Preline UI JavaScript -->
  <script src="./node_modules/preline/dist/preline.js"></script>
</body>
</html>
