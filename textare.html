<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preline UI Textarea Practice</title>
  <!-- Tailwind Output CSS -->
  <link href="./src/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

  <!-- Textarea (Original Classes Unchanged) -->
  <div class="max-w-sm w-full">
    <textarea class="py-2 px-3 sm:py-3 sm:px-4 block w-full bg-layer border-layer-line rounded-lg sm:text-sm text-foreground placeholder:text-muted-foreground-1 focus:border-primary-focus focus:ring-primary-focus disabled:opacity-50 disabled:pointer-events-none [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-scrollbar-track [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb" rows="3" placeholder="Readonly" readonly></textarea>
  </div>
  <!-- End Textarea -->

  <!-- Preline UI JavaScript -->
  <script src="./node_modules/preline/dist/preline.js"></script>
</body>
</html>
